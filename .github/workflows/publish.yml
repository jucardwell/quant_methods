name: Publish course site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system libraries for spatial R packages
        run: sudo apt-get update && sudo apt-get install -y libudunits2-dev libgdal-dev libgeos-dev libproj-dev libglpk-dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::sf
            any::tmap
            any::spdep
            any::spatialreg
            any::sfdep
            any::terra
            any::stars
            any::sp
            any::gstat
            any::tigris
            any::spatstat
            any::gt
            any::e1071
            any::maptiles
            any::car
            any::knitr
            any::rmarkdown

      - name: Install INLA
        run: Rscript -e 'install.packages("INLA", repos = c(getOption("repos"), INLA = "https://inla.r-inla-download.org/R/stable"), dep = TRUE)'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages for the answer-key lock
        run: pip install cryptography beautifulsoup4

      - name: Turn slide decks into PDFs
        run: |
          if ls slides/*.pptx >/dev/null 2>&1; then
            sudo apt-get install -y libreoffice-impress
            soffice --headless --convert-to pdf --outdir slides slides/*.pptx
          fi

      - name: Render site
        env:
          GEOG391_KEY_CODEWORDS: ${{ secrets.GEOG391_KEY_CODEWORDS }}
        run: quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
